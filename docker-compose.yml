services:
  aether-beats:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether-beats
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
